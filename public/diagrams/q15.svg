<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 160" width="100%" height="100%">
  <rect width="450" height="160" fill="#fcfcfd" rx="6"/>
  
  <!-- Lens A: Biconcave -->
  <g transform="translate(45, 10)">
    <path d="M 0 10 C 12 50 12 70 0 110 L 24 110 C 12 70 12 50 24 10 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="12" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">(A)</text>
  </g>
  
  <!-- Lens B: Plano-concave -->
  <g transform="translate(130, 10)">
    <path d="M 0 10 L 0 110 L 18 110 C 6 70 6 50 18 10 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="9" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">(B)</text>
  </g>
  
  <!-- Lens C: Plano-convex (thin) -->
  <g transform="translate(215, 10)">
    <path d="M 0 10 L 0 110 C 14 85 14 35 0 10 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="6" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">(C)</text>
  </g>
  
  <!-- Lens D: Biconvex (thin) -->
  <g transform="translate(295, 10)">
    <path d="M 10 10 C 0 45 0 75 10 110 C 20 75 20 45 10 10 Z" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="10" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155" text-anchor="middle">(D)</text>
  </g>
  
  <!-- Lens E: Biconvex (steepest curvature / thickest -> shortest focal length) -->
  <g transform="translate(375, 10)">
    <path d="M 15 10 C -5 45 -5 75 15 110 C 35 75 35 45 15 10 Z" fill="#bae6fd" stroke="#0284c7" stroke-width="2"/>
    <text x="15" y="135" font-family="sans-serif" font-size="13" font-weight="bold" fill="#059669" text-anchor="middle">(E) ✓</text>
  </g>
</svg>
