<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <rect width="320" height="220" fill="#fcfcfd" rx="6"/>
  <!-- Top Resistor R -->
  <line x1="80" y1="40" x2="130" y2="40" stroke="#0f172a" stroke-width="2"/>
  <polyline points="130,40 135,32 145,48 155,32 165,48 175,32 185,48 190,40" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="155" y="24" font-family="serif" font-size="15" font-style="italic" font-weight="bold">R</text>
  <line x1="190" y1="40" x2="240" y2="40" stroke="#0f172a" stroke-width="2"/>

  <!-- Right Inductor L -->
  <line x1="240" y1="40" x2="240" y2="80" stroke="#0f172a" stroke-width="2"/>
  <path d="M 240 80 C 255 80, 255 95, 240 95 C 255 95, 255 110, 240 110 C 255 110, 255 125, 240 125 C 255 125, 255 140, 240 140" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="260" y="115" font-family="serif" font-size="15" font-style="italic" font-weight="bold">L</text>
  <line x1="240" y1="140" x2="240" y2="180" stroke="#0f172a" stroke-width="2"/>

  <!-- Bottom Capacitor C -->
  <line x1="240" y1="180" x2="170" y2="180" stroke="#0f172a" stroke-width="2"/>
  <line x1="170" y1="168" x2="170" y2="192" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="155" y1="168" x2="155" y2="192" stroke="#0f172a" stroke-width="2.5"/>
  <text x="158" y="160" font-family="serif" font-size="15" font-style="italic" font-weight="bold">C</text>
  <line x1="155" y1="180" x2="80" y2="180" stroke="#0f172a" stroke-width="2"/>

  <!-- Left AC EMF Source -->
  <line x1="80" y1="180" x2="80" y2="130" stroke="#0f172a" stroke-width="2"/>
  <circle cx="80" cy="110" r="20" fill="none" stroke="#0f172a" stroke-width="2"/>
  <path d="M 70 110 Q 75 102 80 110 T 90 110" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="40" y="115" font-family="serif" font-size="18" font-style="italic" font-weight="bold">ℰ</text>
  <line x1="80" y1="90" x2="80" y2="40" stroke="#0f172a" stroke-width="2"/>
</svg>
