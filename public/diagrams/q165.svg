<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 260" width="100%" height="100%">
  <rect width="280" height="260" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Vertical dashed reference line -->
  <line x1="100" y1="210" x2="100" y2="40" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Angle theta arc -->
  <path d="M 100 130 A 80 80 0 0 1 125 135" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <text x="110" y="125" font-family="serif" font-size="16" font-style="italic">θ</text>

  <!-- Base pivot -->
  <line x1="70" y1="210" x2="130" y2="210" stroke="#0f172a" stroke-width="3"/>
  <circle cx="100" cy="210" r="5" fill="#0f172a"/>

  <!-- Rod of length L tilted by theta -->
  <line x1="100" y1="210" x2="170" y2="50" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Labels M and L -->
  <text x="120" y="70" font-family="serif" font-size="16" font-style="italic" font-weight="bold">M</text>
  <text x="155" y="130" font-family="serif" font-size="16" font-style="italic">L</text>

  <!-- Rotation direction arrow -->
  <path d="M 160 35 A 40 40 0 0 1 185 55" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arr)"/>
</svg>
