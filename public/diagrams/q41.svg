<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270" width="100%" height="100%">
  <rect width="360" height="270" fill="#fcfcfd" rx="6"/>
  <!-- Axes -->
  <line x1="60" y1="210" x2="320" y2="210" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="320,210 312,206 312,214" fill="#0f172a"/>
  <text x="180" y="240" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Frequency (× 10¹⁴ Hz)</text>
  
  <line x1="60" y1="210" x2="60" y2="30" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="60,30 56,38 64,38" fill="#0f172a"/>
  <text x="25" y="120" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle" transform="rotate(-90 25 120)">Stopping Potential (V)</text>
  
  <!-- Ticks -->
  <text x="50" y="214" font-family="serif" font-size="12" text-anchor="end">0</text>
  <line x1="140" y1="210" x2="140" y2="216" stroke="#0f172a"/>
  <text x="140" y="226" font-family="serif" font-size="12" text-anchor="middle">4</text>
  
  <line x1="220" y1="210" x2="220" y2="216" stroke="#0f172a"/>
  <text x="220" y="226" font-family="serif" font-size="12" text-anchor="middle">8</text>
  
  <line x1="300" y1="210" x2="300" y2="216" stroke="#0f172a"/>
  <text x="300" y="226" font-family="serif" font-size="12" text-anchor="middle">12</text>
  
  <line x1="56" y1="140" x2="60" y2="140" stroke="#0f172a"/>
  <text x="50" y="144" font-family="serif" font-size="12" text-anchor="end">1</text>
  
  <line x1="56" y1="70" x2="60" y2="70" stroke="#0f172a"/>
  <text x="50" y="74" font-family="serif" font-size="12" text-anchor="end">2</text>
  
  <!-- Best straight line fitted -->
  <!-- Intercept on freq axis at ~4.5 -> X=150, Y=210; At X=270, Y=40 -->
  <line x1="120" y1="240" x2="275" y2="35" stroke="#2563eb" stroke-width="2.5"/>
  
  <!-- Data points on line -->
  <circle cx="180" cy="170" r="3.5" fill="#0f172a"/>
  <circle cx="205" cy="130" r="3.5" fill="#0f172a"/>
  <circle cx="230" cy="95" r="3.5" fill="#0f172a"/>
  <circle cx="250" cy="65" r="3.5" fill="#0f172a"/>
  
  <!-- Formula label: Slope = h / e -->
  <rect x="75" y="45" width="110" height="35" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="130" y="68" font-family="serif" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Slope = h / e</text>
</svg>
