<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="100%" height="100%">
  <rect width="380" height="240" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="60" y1="180" x2="340" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="60" y1="180" x2="60" y2="30" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="345" y="185" font-family="serif" font-size="16" font-style="italic">v</text>
  <text x="45" y="24" font-family="serif" font-size="15" font-style="italic">P(v)</text>

  <!-- Level 'a' dashed line -->
  <line x1="60" y1="80" x2="220" y2="80" stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="45" y="85" font-family="serif" font-size="15" font-style="italic">a</text>

  <!-- Trapezoid shape: (60,180) -> (140, 80) -> (220, 80) -> (300, 180) -->
  <polygon points="60,180 140,80 220,80 300,180" fill="#f1f5f9" stroke="#0f172a" stroke-width="2.5"/>

  <!-- X ticks -->
  <line x1="140" y1="175" x2="140" y2="185" stroke="#0f172a" stroke-width="1.5"/>
  <text x="140" y="202" font-family="serif" font-size="14" font-style="italic" text-anchor="middle">v₀</text>

  <line x1="220" y1="175" x2="220" y2="185" stroke="#0f172a" stroke-width="1.5"/>
  <text x="220" y="202" font-family="serif" font-size="14" font-style="italic" text-anchor="middle">2v₀</text>

  <line x1="300" y1="175" x2="300" y2="185" stroke="#0f172a" stroke-width="1.5"/>
  <text x="300" y="202" font-family="serif" font-size="14" font-style="italic" text-anchor="middle">3v₀</text>
</svg>
