<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="100%" height="100%">
  <rect width="340" height="240" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="blue-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Axes -->
  <line x1="60" y1="200" x2="300" y2="200" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="60" y1="200" x2="60" y2="30" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="305" y="205" font-family="serif" font-size="14" font-style="italic">S (J/K)</text>
  <text x="35" y="25" font-family="serif" font-size="14" font-style="italic">T (K)</text>

  <!-- Temperature levels -->
  <line x1="55" y1="70" x2="65" y2="70" stroke="#0f172a" stroke-width="1.5"/>
  <text x="25" y="74" font-family="sans-serif" font-size="12">305</text>
  <line x1="60" y1="70" x2="100" y2="70" stroke="#94a3b8" stroke-dasharray="3,3"/>

  <line x1="55" y1="130" x2="65" y2="130" stroke="#0f172a" stroke-width="1.5"/>
  <text x="25" y="134" font-family="sans-serif" font-size="12">295</text>
  <line x1="60" y1="130" x2="100" y2="130" stroke="#94a3b8" stroke-dasharray="3,3"/>

  <!-- Carnot rectangle: a -> d -> c -> b -> a (counterclockwise refrigerator/air-conditioner cycle) -->
  <!-- a: (100, 70), d: (240, 70), c: (240, 130), b: (100, 130) -->
  <!-- Notice in the figure: a is top-left, d is top-right, c is bottom-right, b is bottom-left -->
  <!-- Arrows: d to a (at 305K, heat dumped to outside) or a to d? -->
  <!-- In refrigeration: heat absorbed at low T (b -> c, heat absorbed from inside), work done, heat dumped at high T (d -> a) -->
  <!-- In diagram on page 76: Arrow from a to d? Wait, let's look at diagram on page 76! -->
  <!-- Arrow at top: a -> d! Arrow at bottom: c -> b! Left: b -> a! Right: d -> c! -->
  <polygon points="100,70 240,70 240,130 100,130" fill="#eff6ff" stroke="#0f172a" stroke-width="2"/>

  <!-- Direction arrows on sides -->
  <line x1="100" y1="70" x2="180" y2="70" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="240" y1="70" x2="240" y2="105" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="240" y1="130" x2="160" y2="130" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="100" y1="130" x2="100" y2="95" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Corner labels -->
  <text x="100" y="62" font-family="serif" font-size="14" font-style="italic">a</text>
  <text x="240" y="62" font-family="serif" font-size="14" font-style="italic">d</text>
  <text x="245" y="135" font-family="serif" font-size="14" font-style="italic">c</text>
  <text x="105" y="135" font-family="serif" font-size="14" font-style="italic">b</text>
</svg>
