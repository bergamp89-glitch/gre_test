<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 180" width="100%" height="100%">
  <rect width="360" height="180" fill="#fcfcfd" rx="6"/>
  <!-- Axes -->
  <line x1="50" y1="130" x2="310" y2="130" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="310,130 302,126 302,134" fill="#0f172a"/>
  <text x="315" y="134" font-family="serif" font-size="14" font-style="italic">x</text>
  
  <line x1="160" y1="150" x2="160" y2="30" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="160,30 156,38 164,38" fill="#0f172a"/>
  <text x="160" y="20" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Potential Energy</text>
  <text x="150" y="145" font-family="serif" font-size="13">0</text>
  
  <!-- Step Potential V(x): 0 for x <= 0, V0 for x > 0 -->
  <line x1="60" y1="130" x2="160" y2="130" stroke="#2563eb" stroke-width="3"/>
  <line x1="160" y1="130" x2="160" y2="80" stroke="#2563eb" stroke-width="3"/>
  <line x1="160" y1="80" x2="280" y2="80" stroke="#2563eb" stroke-width="3"/>
  <text x="140" y="85" font-family="serif" font-size="14" font-style="italic" font-weight="bold">V₀</text>
  
  <!-- Incident electron energy E > V0 (dashed line at y = 50) -->
  <line x1="60" y1="50" x2="280" y2="50" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="140" y="55" font-family="serif" font-size="15" font-style="italic" font-weight="bold" fill="#ef4444">E</text>
  
  <text x="210" y="165" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">R = ((k₁ - k₂) / (k₁ + k₂))²</text>
</svg>
