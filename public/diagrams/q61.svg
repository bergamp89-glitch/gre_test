<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="100%" height="100%">
  <rect width="340" height="240" fill="#fcfcfd" rx="6"/>
  <!-- Uniform B field grid (into page: ×) -->
  <g fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">
    <text x="80" y="45">×</text><text x="120" y="45">×</text><text x="160" y="45">×</text><text x="200" y="45">×</text><text x="240" y="45">×</text>
    <text x="80" y="75">×</text><text x="120" y="75">×</text><text x="160" y="75">×</text><text x="200" y="75">×</text><text x="240" y="75">×</text>
    <text x="80" y="105">×</text><text x="120" y="105">×</text><text x="160" y="105">×</text><text x="200" y="105">×</text><text x="240" y="105">×</text>
  </g>
  <text x="260" y="45" font-family="serif" font-size="16" font-weight="bold" fill="#0f172a">B</text>
  
  <!-- Boundary wall -->
  <line x1="60" y1="120" x2="260" y2="120" stroke="#0f172a" stroke-width="2.5"/>
  
  <!-- Entrance slit at x=90, y=120 -->
  <line x1="90" y1="180" x2="90" y2="120" stroke="#2563eb" stroke-width="2"/>
  <polygon points="90,125 86,135 94,135" fill="#2563eb"/>
  <text x="75" y="155" font-family="serif" font-size="15" font-style="italic" font-weight="bold" fill="#2563eb">v</text>
  
  <!-- Semicircular trajectory hitting wall at distance d -->
  <!-- Diameter d = 2R, from x=90 to x=210 (d = 120px) -->
  <path d="M 90 120 A 60 60 0 0 1 210 120" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <circle cx="210" cy="120" r="4" fill="#ef4444"/>
  
  <!-- Distance d dimension line -->
  <line x1="90" y1="135" x2="210" y2="135" stroke="#475569" stroke-width="1.2"/>
  <line x1="90" y1="130" x2="90" y2="140" stroke="#475569" stroke-width="1.2"/>
  <line x1="210" y1="130" x2="210" y2="140" stroke="#475569" stroke-width="1.2"/>
  <text x="150" y="150" font-family="serif" font-size="14" font-style="italic" font-weight="bold" text-anchor="middle">d</text>
</svg>
