<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="100%">
  <rect width="340" height="220" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Ceiling -->
  <line x1="60" y1="30" x2="140" y2="30" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Vertical spring -->
  <path d="M 100 30 L 100 45 C 112 48, 112 56, 100 56 C 88 56, 88 64, 100 64 C 112 64, 112 72, 100 72 C 88 72, 88 80, 100 80 C 112 80, 112 88, 100 88 L 100 100" fill="none" stroke="#0f172a" stroke-width="2"/>

  <!-- Oscillating charge +q -->
  <circle cx="100" cy="115" r="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="100" y="120" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">+q</text>

  <!-- Up and down oscillation double-arrow -->
  <line x1="125" y1="95" x2="125" y2="135" stroke="#0f172a" stroke-width="1.8" marker-start="url(#arr)" marker-end="url(#arr)"/>

  <!-- Point P to the right -->
  <circle cx="270" cy="115" r="4.5" fill="#0f172a"/>
  <text x="282" y="120" font-family="serif" font-size="16" font-style="italic" font-weight="bold">P</text>
</svg>
