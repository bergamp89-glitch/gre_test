<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="100%" height="100%">
  <rect width="360" height="260" fill="#fcfcfd" rx="6"/>
  
  <!-- Bar magnet -->
  <g transform="translate(100, 30)">
    <rect x="0" y="0" width="40" height="25" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>
    <text x="20" y="18" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
    <rect x="0" y="25" width="40" height="25" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="20" y="43" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
    <!-- Arrow moving down -->
    <path d="M -15 15 L -15 45 M -20 40 L -15 50 L -10 40" fill="none" stroke="#334155" stroke-width="2"/>
    <text x="-40" y="32" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle">Motion</text>
    <text x="-40" y="44" font-family="sans-serif" font-size="10" fill="#475569" text-anchor="middle">toward loop</text>
  </g>
  
  <!-- Loop -->
  <path d="M 210 130 C 260 110, 260 80, 210 65 C 160 80, 160 110, 210 130" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  
  <!-- Leads to circuit -->
  <line x1="205" y1="130" x2="205" y2="155" stroke="#0f172a" stroke-width="2"/>
  <line x1="215" y1="130" x2="215" y2="155" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Points a and b with resistor R -->
  <line x1="205" y1="155" x2="175" y2="180" stroke="#0f172a" stroke-width="2"/>
  <circle cx="205" cy="155" r="3" fill="#0f172a"/>
  <text x="215" y="152" font-family="serif" font-size="14" font-style="italic">a</text>
  
  <line x1="215" y1="155" x2="245" y2="165" stroke="#0f172a" stroke-width="2"/>
  <!-- Resistor zigzag -->
  <path d="M 245 165 L 250 160 L 256 170 L 262 160 L 268 170 L 274 160 L 280 170 L 285 165" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="265" y="152" font-family="serif" font-size="14" font-style="italic">R</text>
  
  <line x1="285" y1="165" x2="310" y2="190" stroke="#0f172a" stroke-width="2"/>
  <line x1="175" y1="180" x2="240" y2="230" stroke="#0f172a" stroke-width="2"/>
  <line x1="310" y1="190" x2="240" y2="230" stroke="#0f172a" stroke-width="2"/>
  <circle cx="310" cy="190" r="3" fill="#0f172a"/>
  <text x="320" y="195" font-family="serif" font-size="14" font-style="italic">b</text>
</svg>
