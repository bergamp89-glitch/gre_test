<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" width="100%" height="100%">
  <rect width="340" height="240" fill="#fcfcfd" rx="6"/>
  <!-- Magnetic field background (into page: ×) -->
  <g fill="#94a3b8" font-family="sans-serif" font-size="14" text-anchor="middle">
    <text x="60" y="40">×</text><text x="110" y="40">×</text><text x="160" y="40">×</text><text x="210" y="40">×</text><text x="260" y="40">×</text>
    <text x="60" y="80">×</text><text x="110" y="80">×</text><text x="160" y="80">×</text><text x="210" y="80">×</text><text x="260" y="80">×</text>
    <text x="60" y="120">×</text><text x="110" y="120">×</text><text x="160" y="120">×</text><text x="210" y="120">×</text><text x="260" y="120">×</text>
    <text x="60" y="160">×</text><text x="110" y="160">×</text><text x="160" y="160">×</text><text x="210" y="160">×</text><text x="260" y="160">×</text>
    <text x="60" y="200">×</text><text x="110" y="200">×</text><text x="160" y="200">×</text><text x="210" y="200">×</text><text x="260" y="200">×</text>
  </g>
  <text x="275" y="40" font-family="serif" font-size="16" font-weight="bold" fill="#0f172a">B</text>
  
  <!-- Outer circle r2 (radius = 75px) -->
  <circle cx="160" cy="120" r="75" fill="none" stroke="#2563eb" stroke-width="2"/>
  <!-- Electron 2 -->
  <circle cx="160" cy="45" r="4" fill="#2563eb"/>
  <text x="175" y="45" font-family="serif" font-size="13" font-style="italic" fill="#2563eb">e⁻</text>
  
  <!-- Inner circle r1 (radius = 25px) -->
  <circle cx="160" cy="120" r="25" fill="none" stroke="#059669" stroke-width="2"/>
  <!-- Electron 1 -->
  <circle cx="160" cy="95" r="4" fill="#059669"/>
  <text x="175" y="95" font-family="serif" font-size="13" font-style="italic" fill="#059669">e⁻</text>
  
  <!-- Center marker -->
  <circle cx="160" cy="120" r="2" fill="#0f172a"/>
  
  <!-- Radius lines -->
  <line x1="160" y1="120" x2="185" y2="120" stroke="#059669" stroke-width="1.5"/>
  <text x="172" y="135" font-family="serif" font-size="12" font-style="italic" fill="#059669" text-anchor="middle">r₁</text>
  
  <line x1="160" y1="120" x2="235" y2="120" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="210" y="135" font-family="serif" font-size="12" font-style="italic" fill="#2563eb" text-anchor="middle">r₂</text>
  
  <text x="160" y="228" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">r₁ / r₂ = 1/3   ⇒   v₁ / v₂ = 1/3</text>
</svg>
