<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 260" width="100%" height="100%">
  <rect width="380" height="260" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Coordinate axes in top right -->
  <g transform="translate(300, 45)">
    <line x1="0" y1="40" x2="0" y2="0" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="0" y1="40" x2="40" y2="40" stroke="#0f172a" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="-4" y="-8" font-family="serif" font-size="16" font-style="italic">y</text>
    <text x="48" y="44" font-family="serif" font-size="16" font-style="italic">x</text>
  </g>

  <!-- Collision Target point -->
  <circle cx="230" cy="110" r="3" fill="#cbd5e1"/>

  <!-- Object 1: 0.5 kg moving right at 2 m/s -->
  <circle cx="80" cy="110" r="8" fill="#0f172a"/>
  <line x1="80" y1="110" x2="190" y2="110" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <text x="110" y="98" font-family="sans-serif" font-size="14" font-weight="600" fill="#0f172a">0.5 kg, 2 m/s</text>

  <!-- Object 2: 1 kg moving up at 1 m/s -->
  <circle cx="230" cy="210" r="10" fill="#0f172a"/>
  <line x1="230" y1="210" x2="230" y2="135" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arrow)"/>
  <text x="245" y="185" font-family="sans-serif" font-size="14" font-weight="600" fill="#0f172a">1 kg, 1 m/s</text>
</svg>
