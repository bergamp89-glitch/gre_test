<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <rect width="320" height="280" fill="#fcfcfd" rx="6"/>
  <!-- Conducting sphere -->
  <circle cx="160" cy="140" r="105" fill="#cbd5e1" stroke="#0f172a" stroke-width="2.5"/>

  <!-- Cavity A with +2q -->
  <circle cx="150" cy="90" r="30" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="150" cy="90" r="4" fill="#0f172a"/>
  <text x="150" y="80" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">+2q</text>
  <text x="150" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">A</text>

  <!-- Cavity B with -4q -->
  <circle cx="160" cy="180" r="32" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <circle cx="160" cy="180" r="4" fill="#0f172a"/>
  <text x="160" y="172" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">−4q</text>
  <text x="160" y="202" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">B</text>

  <!-- Cavity C (empty) -->
  <circle cx="215" cy="125" r="18" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="215" y="130" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a" text-anchor="middle">C</text>
</svg>
