<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 220" width="100%" height="100%">
  <rect width="540" height="220" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Arrangement (1) -->
  <g transform="translate(10, 20)">
    <line x1="20" y1="90" x2="160" y2="90" stroke="#0f172a" stroke-width="2"/>
    <circle cx="20" cy="90" r="5" fill="#0f172a"/>
    <text x="16" y="112" font-family="serif" font-size="14" font-style="italic">e</text>
    <circle cx="80" cy="90" r="5" fill="#0f172a"/>
    <text x="76" y="112" font-family="serif" font-size="14" font-style="italic">p</text>
    <circle cx="160" cy="90" r="5" fill="#0f172a"/>
    <text x="156" y="112" font-family="serif" font-size="14" font-style="italic">p</text>

    <!-- Distance d -->
    <line x1="20" y1="75" x2="80" y2="75" stroke="#64748b" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="47" y="70" font-family="serif" font-size="13" font-style="italic">d</text>

    <!-- Distance D -->
    <line x1="20" y1="50" x2="160" y2="50" stroke="#64748b" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="85" y="45" font-family="serif" font-size="13" font-style="italic">D</text>

    <text x="90" y="150" font-family="sans-serif" font-size="14" font-weight="bold">(1)</text>
  </g>

  <!-- Arrangement (2) -->
  <g transform="translate(190, 20)">
    <line x1="20" y1="90" x2="180" y2="90" stroke="#0f172a" stroke-width="2"/>
    <circle cx="20" cy="90" r="5" fill="#0f172a"/>
    <text x="16" y="112" font-family="serif" font-size="14" font-style="italic">p</text>
    <circle cx="80" cy="90" r="5" fill="#0f172a"/>
    <text x="76" y="112" font-family="serif" font-size="14" font-style="italic">e</text>
    <circle cx="180" cy="90" r="5" fill="#0f172a"/>
    <text x="176" y="112" font-family="serif" font-size="14" font-style="italic">p</text>

    <!-- Distance d -->
    <line x1="20" y1="75" x2="80" y2="75" stroke="#64748b" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="47" y="70" font-family="serif" font-size="13" font-style="italic">d</text>

    <!-- Distance D -->
    <line x1="80" y1="75" x2="180" y2="75" stroke="#64748b" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="125" y="70" font-family="serif" font-size="13" font-style="italic">D</text>

    <text x="100" y="150" font-family="sans-serif" font-size="14" font-weight="bold">(2)</text>
  </g>

  <!-- Arrangement (3) -->
  <g transform="translate(390, 20)">
    <!-- Vertical line to p -->
    <line x1="30" y1="90" x2="30" y2="20" stroke="#0f172a" stroke-width="2"/>
    <!-- Horizontal line to p -->
    <line x1="30" y1="90" x2="130" y2="90" stroke="#0f172a" stroke-width="2"/>

    <circle cx="30" cy="90" r="5" fill="#0f172a"/>
    <text x="18" y="105" font-family="serif" font-size="14" font-style="italic">e</text>

    <circle cx="30" cy="20" r="5" fill="#0f172a"/>
    <text x="38" y="24" font-family="serif" font-size="14" font-style="italic">p</text>
    <text x="12" y="58" font-family="serif" font-size="13" font-style="italic">d</text>

    <circle cx="130" cy="90" r="5" fill="#0f172a"/>
    <text x="126" y="112" font-family="serif" font-size="14" font-style="italic">p</text>
    <!-- Distance D -->
    <line x1="30" y1="110" x2="130" y2="110" stroke="#64748b" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="75" y="125" font-family="serif" font-size="13" font-style="italic">D</text>

    <text x="80" y="150" font-family="sans-serif" font-size="14" font-weight="bold">(3)</text>
  </g>
</svg>
