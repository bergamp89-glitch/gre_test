<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <rect width="380" height="200" fill="#fcfcfd" rx="6"/>
  <!-- Circuit diagram -->
  <line x1="80" y1="40" x2="140" y2="40" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Resistor -->
  <polyline points="140,40 145,32 155,48 165,32 175,48 185,32 195,48 200,40" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="200" y1="40" x2="230" y2="40" stroke="#0f172a" stroke-width="2"/>

  <!-- Diode pointing right -->
  <polygon points="230,28 230,52 250,40" fill="#0f172a" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="250" y1="28" x2="250" y2="52" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="250" y1="40" x2="290" y2="40" stroke="#0f172a" stroke-width="2"/>

  <!-- Right wire down -->
  <line x1="290" y1="40" x2="290" y2="160" stroke="#0f172a" stroke-width="2"/>
  <!-- Current arrow i -->
  <path d="M 296 90 L 296 110 L 292 105 M 296 110 L 300 105" stroke="#2563eb" stroke-width="2" fill="none"/>
  <text x="304" y="105" font-family="serif" font-size="14" font-style="italic">i</text>

  <!-- Left wire down -->
  <line x1="80" y1="40" x2="80" y2="160" stroke="#0f172a" stroke-width="2"/>
  <!-- Current arrow i -->
  <path d="M 74 110 L 74 90 L 70 95 M 74 90 L 78 95" stroke="#2563eb" stroke-width="2" fill="none"/>
  <text x="60" y="105" font-family="serif" font-size="14" font-style="italic">i</text>

  <!-- Bottom wire with AC source -->
  <line x1="80" y1="160" x2="165" y2="160" stroke="#0f172a" stroke-width="2"/>
  <circle cx="185" cy="160" r="20" fill="none" stroke="#0f172a" stroke-width="2"/>
  <path d="M 175 160 Q 180 152 185 160 T 195 160" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="205" y1="160" x2="290" y2="160" stroke="#0f172a" stroke-width="2"/>

  <!-- AC Source Label -->
  <text x="185" y="195" font-family="serif" font-size="16" font-style="italic" text-anchor="middle">ℰ(t)</text>
  <text x="165" y="148" font-family="sans-serif" font-size="12" fill="#0f172a">+</text>
  <text x="202" y="148" font-family="sans-serif" font-size="14" fill="#0f172a">−</text>
</svg>
