<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 280" width="100%" height="100%">
  <rect width="340" height="280" fill="#fcfcfd" rx="6"/>
  <!-- Coordinate axes in xz-plane -->
  <!-- x-axis (vertical in diagram) -->
  <line x1="170" y1="260" x2="170" y2="20" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="170,20 166,28 174,28" fill="#0f172a"/>
  <text x="160" y="25" font-family="serif" font-size="14" font-style="italic">x</text>
  
  <!-- z-axis (horizontal in diagram) -->
  <line x1="30" y1="140" x2="310" y2="140" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="310,140 302,136 302,144" fill="#0f172a"/>
  <text x="315" y="145" font-family="serif" font-size="14" font-style="italic">z</text>
  
  <!-- Center origin -->
  <circle cx="170" cy="140" r="3" fill="#0f172a"/>
  
  <!-- Wire 1 along z-axis (horizontal) -->
  <polygon points="270,140 260,136 260,144" fill="#2563eb"/>
  <text x="275" y="130" font-family="serif" font-size="14" font-weight="bold" fill="#2563eb">I</text>
  
  <!-- Wire 2 at +45 deg to z-axis -->
  <line x1="70" y1="240" x2="270" y2="40" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="255,55 245,58 252,65" fill="#2563eb"/>
  <text x="265" y="50" font-family="serif" font-size="14" font-weight="bold" fill="#2563eb">I</text>
  
  <!-- Wire 3 at -45 deg to z-axis -->
  <line x1="70" y1="40" x2="270" y2="240" stroke="#2563eb" stroke-width="2.5"/>
  <polygon points="255,225 252,215 245,222" fill="#2563eb"/>
  <text x="265" y="240" font-family="serif" font-size="14" font-weight="bold" fill="#2563eb">I</text>
  
  <!-- Angle arcs 45° -->
  <path d="M 210 140 A 40 40 0 0 0 198 112" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <text x="225" y="125" font-family="sans-serif" font-size="11" fill="#475569">45°</text>
  
  <path d="M 210 140 A 40 40 0 0 1 198 168" fill="none" stroke="#64748b" stroke-width="1.2"/>
  <text x="225" y="165" font-family="sans-serif" font-size="11" fill="#475569">45°</text>
</svg>
