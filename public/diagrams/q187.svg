<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <rect width="380" height="200" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Track / Table -->
  <line x1="40" y1="80" x2="260" y2="80" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="260" y1="80" x2="260" y2="180" stroke="#0f172a" stroke-width="2"/>

  <!-- Cart / mass m1 on track -->
  <rect x="130" y="55" width="50" height="25" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="155" y="72" font-family="serif" font-size="14" font-style="italic" text-anchor="middle">m₁</text>

  <!-- Positions x1 and x2 -->
  <line x1="90" y1="75" x2="90" y2="85" stroke="#0f172a" stroke-width="2"/>
  <text x="90" y="98" font-family="serif" font-size="14" font-style="italic" text-anchor="middle">x₁</text>

  <line x1="190" y1="75" x2="190" y2="85" stroke="#0f172a" stroke-width="2"/>
  <text x="190" y="98" font-family="serif" font-size="14" font-style="italic" text-anchor="middle">x₂</text>

  <!-- Distance d between x1 and x2 -->
  <line x1="90" y1="110" x2="190" y2="110" stroke="#64748b" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="140" y="125" font-family="serif" font-size="14" font-style="italic" text-anchor="middle">d</text>

  <!-- Pulley -->
  <circle cx="260" cy="80" r="10" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>

  <!-- String & hanging mass m2 -->
  <line x1="180" y1="67" x2="260" y2="70" stroke="#0f172a" stroke-width="1.5"/>
  <line x1="270" y1="80" x2="270" y2="120" stroke="#0f172a" stroke-width="1.5"/>
  <rect x="258" y="120" width="24" height="24" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="295" y="136" font-family="serif" font-size="14" font-style="italic">m₂</text>
</svg>
