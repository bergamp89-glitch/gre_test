<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 320" width="100%" height="100%">
  <rect width="380" height="320" fill="#ffffff" rx="6"/>
  
  <!-- Outer axes box -->
  <rect x="60" y="20" width="280" height="260" fill="none" stroke="#000000" stroke-width="1.5"/>
  
  <!-- Logarithmic grid lines X: 1, 10, 100, 1000 -->
  <!-- X: 60 = 1, 153.3 = 10, 246.6 = 100, 340 = 1000 (each decade ~93.3px) -->
  <line x1="153.3" y1="20" x2="153.3" y2="280" stroke="#000000" stroke-width="1"/>
  <line x1="246.6" y1="20" x2="246.6" y2="280" stroke="#000000" stroke-width="1"/>
  
  <!-- Sub-grid lines X (2..9) -->
  <g stroke="#e2e8f0" stroke-width="0.8">
    <line x1="88" y1="20" x2="88" y2="280"/><line x1="104.5" y1="20" x2="104.5" y2="280"/><line x1="116.2" y1="20" x2="116.2" y2="280"/><line x1="125" y1="20" x2="125" y2="280"/><line x1="133" y1="20" x2="133" y2="280"/><line x1="140" y1="20" x2="140" y2="280"/><line x1="147" y1="20" x2="147" y2="280"/>
    <line x1="181.3" y1="20" x2="181.3" y2="280"/><line x1="197.8" y1="20" x2="197.8" y2="280"/><line x1="209.5" y1="20" x2="209.5" y2="280"/><line x1="218.3" y1="20" x2="218.3" y2="280"/><line x1="226.3" y1="20" x2="226.3" y2="280"/><line x1="233.3" y1="20" x2="233.3" y2="280"/><line x1="240.3" y1="20" x2="240.3" y2="280"/>
  </g>
  
  <!-- Logarithmic grid lines Y: 1, 10, 100, 1000 -->
  <!-- Y: 280 = 1, 193.3 = 10, 106.6 = 100, 20 = 1000 -->
  <line x1="60" y1="193.3" x2="340" y2="193.3" stroke="#000000" stroke-width="1"/>
  <line x1="60" y1="106.6" x2="340" y2="106.6" stroke="#000000" stroke-width="1"/>
  
  <!-- Plot line: y = 6*sqrt(x) -->
  <!-- At x=1, y=6 -> X=60, Y=280 - 93.3*log10(6) = 280 - 72.6 = 207.4 -->
  <!-- At x=100, y=60 -> X=246.6, Y=193.3 - 93.3*log10(6) = 193.3 - 72.6 = 120.7 -->
  <!-- At x=277, y=100 -> X=288, Y=106.6 -->
  <!-- At x=500, y=134.1 -> X=311, Y=81.6 -->
  <line x1="60" y1="207.4" x2="311" y2="81.6" stroke="#000000" stroke-width="2.5"/>
  
  <!-- Labels -->
  <text x="60" y="295" font-family="serif" font-size="12" text-anchor="middle">1</text>
  <text x="153.3" y="295" font-family="serif" font-size="12" text-anchor="middle">10</text>
  <text x="246.6" y="295" font-family="serif" font-size="12" text-anchor="middle">100</text>
  <text x="340" y="295" font-family="serif" font-size="12" text-anchor="middle">1000</text>
  <text x="200" y="312" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Variable x</text>
  
  <text x="52" y="284" font-family="serif" font-size="12" text-anchor="end">1</text>
  <text x="52" y="197" font-family="serif" font-size="12" text-anchor="end">10</text>
  <text x="52" y="111" font-family="serif" font-size="12" text-anchor="end">100</text>
  <text x="52" y="25" font-family="serif" font-size="12" text-anchor="end">1000</text>
  <text x="20" y="150" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold" transform="rotate(-90 20 150)">Variable y</text>
</svg>
