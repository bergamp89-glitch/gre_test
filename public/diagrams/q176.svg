<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%">
  <rect width="360" height="220" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
    <marker id="blue-arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Coordinate axes in top right -->
  <g transform="translate(290, 40)">
    <line x1="0" y1="0" x2="35" y2="0" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr)"/>
    <line x1="0" y1="0" x2="0" y2="35" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr)"/>
    <text x="42" y="4" font-family="serif" font-size="14" font-style="italic">x</text>
    <text x="-4" y="48" font-family="serif" font-size="14" font-style="italic">y</text>
  </g>

  <!-- Velocity Selector Plates -->
  <line x1="120" y1="60" x2="240" y2="60" stroke="#0f172a" stroke-width="3"/>
  <line x1="120" y1="160" x2="240" y2="160" stroke="#0f172a" stroke-width="3"/>

  <!-- Electric field arrows pointing down (+y) -->
  <line x1="150" y1="65" x2="150" y2="150" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="180" y1="65" x2="180" y2="150" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="210" y1="65" x2="210" y2="150" stroke="#0f172a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="125" y="165" font-family="serif" font-size="16" font-style="italic" font-weight="bold">E</text>

  <!-- Magnetic field symbols (crosses into page +z) -->
  <g font-family="sans-serif" font-size="14" fill="#64748b" text-anchor="middle">
    <text x="165" y="85">×</text><text x="195" y="85">×</text><text x="225" y="85">×</text>
    <text x="165" y="135">×</text><text x="195" y="135">×</text><text x="225" y="135">×</text>
  </g>
  <text x="245" y="85" font-family="serif" font-size="16" font-style="italic" font-weight="bold">B</text>

  <!-- Positive ion + beam -->
  <circle cx="60" cy="110" r="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="60" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb" text-anchor="middle">+</text>
  <line x1="75" y1="110" x2="135" y2="110" stroke="#2563eb" stroke-width="2.5" marker-end="url(#blue-arr)"/>
  <text x="100" y="128" font-family="serif" font-size="16" font-style="italic" fill="#2563eb">v</text>
</svg>
