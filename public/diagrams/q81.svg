<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <rect width="380" height="200" fill="#fcfcfd" rx="6"/>
  <!-- Ground and curved ramp -->
  <path d="M 40 160 L 190 160 Q 240 160 270 110 L 310 40" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  
  <!-- Disk at start (x=100, y=135, radius r=25px) -->
  <circle cx="100" cy="135" r="25" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <circle cx="100" cy="135" r="3" fill="#0f172a"/>
  <!-- Velocity arrow v -->
  <line x1="100" y1="135" x2="150" y2="135" stroke="#2563eb" stroke-width="2"/>
  <polygon points="150,135 142,131 142,139" fill="#2563eb"/>
  <text x="130" y="125" font-family="serif" font-size="14" font-style="italic" font-weight="bold" fill="#2563eb">v</text>
  
  <!-- Rotation arrow -->
  <path d="M 85 120 A 18 18 0 0 1 115 120" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <polygon points="115,120 112,126 118,124" fill="#0f172a"/>
  
  <!-- Radius r -->
  <line x1="100" y1="135" x2="100" y2="160" stroke="#475569" stroke-width="1.2"/>
  <text x="92" y="150" font-family="serif" font-size="12" font-style="italic">r</text>
  
  <!-- Disk at top height h (x=285, y=70) -->
  <circle cx="285" cy="70" r="25" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="285" cy="70" r="2" fill="#0f172a"/>
  
  <!-- Height h dimension line -->
  <line x1="285" y1="70" x2="350" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="100" y1="135" x2="350" y2="135" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="340" y1="70" x2="340" y2="135" stroke="#475569" stroke-width="1.5"/>
  <polygon points="340,70 337,78 343,78" fill="#475569"/>
  <polygon points="340,135 337,127 343,127" fill="#475569"/>
  <text x="350" y="105" font-family="serif" font-size="15" font-style="italic" font-weight="bold">h</text>
</svg>
