<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 260" width="100%" height="100%">
  <rect width="460" height="260" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Figure 1 -->
  <g transform="translate(10, 10)">
    <!-- Optical axis -->
    <line x1="20" y1="65" x2="380" y2="65" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Object arrow pointing up at x = 70 -->
    <line x1="70" y1="65" x2="70" y2="35" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- Lens 1 at x = 120 -->
    <ellipse cx="120" cy="65" rx="8" ry="40" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="120" y="62" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">1</text>

    <!-- Inverted Image arrow pointing down at x = 320 -->
    <line x1="320" y1="65" x2="320" y2="105" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- Distances -->
    <line x1="70" y1="90" x2="120" y2="90" stroke="#64748b" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="95" y="103" font-family="sans-serif" font-size="11" text-anchor="middle">25 cm</text>

    <line x1="120" y1="90" x2="320" y2="90" stroke="#64748b" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="220" y="103" font-family="sans-serif" font-size="11" text-anchor="middle">100 cm</text>

    <text x="200" y="125" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 1</text>
  </g>

  <!-- Figure 2 -->
  <g transform="translate(10, 130)">
    <!-- Optical axis -->
    <line x1="20" y1="65" x2="380" y2="65" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Object arrow pointing up at x = 70 -->
    <line x1="70" y1="65" x2="70" y2="35" stroke="#0f172a" stroke-width="2.5" marker-end="url(#arr)"/>

    <!-- Lens 1 at x = 120 -->
    <ellipse cx="120" cy="65" rx="8" ry="40" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="120" y="62" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">1</text>

    <!-- Lens 2 at x = 340 (110 cm from lens 1) -->
    <ellipse cx="340" cy="65" rx="8" ry="40" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <text x="340" y="62" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle" fill="#0f172a">2</text>

    <!-- Distances -->
    <line x1="70" y1="90" x2="120" y2="90" stroke="#64748b" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="95" y="103" font-family="sans-serif" font-size="11" text-anchor="middle">25 cm</text>

    <line x1="120" y1="90" x2="340" y2="90" stroke="#64748b" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="230" y="103" font-family="sans-serif" font-size="11" text-anchor="middle">110 cm</text>

    <text x="200" y="125" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 2</text>
  </g>
</svg>
