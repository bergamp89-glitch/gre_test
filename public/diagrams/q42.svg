<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="100%" height="100%">
  <rect width="380" height="240" fill="#f8fafc" rx="6"/>
  <!-- Oscilloscope Grid 10x8 cm (each cm = 26px) -->
  <g transform="translate(60, 20)">
    <!-- Screen background -->
    <rect x="0" y="0" width="260" height="180" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    
    <!-- Grid lines -->
    <g stroke="#1e293b" stroke-width="1">
      <!-- Verticals every 26px (1 cm) -->
      <line x1="26" y1="0" x2="26" y2="180"/><line x1="52" y1="0" x2="52" y2="180"/><line x1="78" y1="0" x2="78" y2="180"/><line x1="104" y1="0" x2="104" y2="180"/><line x1="130" y1="0" x2="130" y2="180"/><line x1="156" y1="0" x2="156" y2="180"/><line x1="182" y1="0" x2="182" y2="180"/><line x1="208" y1="0" x2="208" y2="180"/><line x1="234" y1="0" x2="234" y2="180"/>
      <!-- Horizontals -->
      <line x1="0" y1="26" x2="260" y2="26"/><line x1="0" y1="52" x2="260" y2="52"/><line x1="0" y1="78" x2="260" y2="78"/><line x1="0" y1="104" x2="260" y2="104"/><line x1="0" y1="130" x2="260" y2="130"/><line x1="0" y1="156" x2="260" y2="156"/>
    </g>
    
    <!-- Center / zero baselines -->
    <!-- Channel 1 at y = 52 (center) -->
    <line x1="0" y1="52" x2="260" y2="52" stroke="#475569" stroke-width="1.2" stroke-dasharray="2,2"/>
    <!-- Channel 2 at y = 130 (center) -->
    <line x1="0" y1="130" x2="260" y2="130" stroke="#475569" stroke-width="1.2" stroke-dasharray="2,2"/>
    
    <!-- Channel 1 waveform (wavelength = 6 cm = 156px): y = 52 - 35*sin(2*pi*x/156) -->
    <path d="M 0 52 C 26 15, 52 15, 78 52 C 104 89, 130 89, 156 52 C 182 15, 208 15, 234 52 L 260 70" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Channel 2 waveform (phase shift 120 deg = 2 cm = 52px shifted): y = 130 - 35*sin(2*pi*(x - 52)/156) -->
    <path d="M 0 160 C 26 145, 30 135, 52 130 C 78 93, 104 93, 130 130 C 156 167, 182 167, 208 130 C 234 93, 260 93, 260 130" fill="none" stroke="#facc15" stroke-width="2.5"/>
    
    <!-- Zero markers on right -->
    <text x="268" y="56" font-family="sans-serif" font-size="12" fill="#38bdf8" font-weight="bold">0 (Ch 1)</text>
    <text x="268" y="134" font-family="sans-serif" font-size="12" fill="#facc15" font-weight="bold">0 (Ch 2)</text>
    
    <!-- 1 cm indicator -->
    <line x1="208" y1="195" x2="234" y2="195" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="208" y1="190" x2="208" y2="200" stroke="#0f172a" stroke-width="1.5"/>
    <line x1="234" y1="190" x2="234" y2="200" stroke="#0f172a" stroke-width="1.5"/>
    <text x="221" y="210" font-family="sans-serif" font-size="10" text-anchor="middle">1 cm</text>
  </g>
  
  <text x="15" y="65" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0284c7">Channel 1</text>
  <text x="15" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ca8a04">Channel 2</text>
</svg>
