<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 200" width="100%" height="100%">
  <rect width="340" height="200" fill="#fcfcfd" rx="6"/>
  <!-- Floor -->
  <line x1="40" y1="140" x2="280" y2="140" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Block A (mA = 25 kg) -->
  <rect x="100" y="90" width="90" height="50" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
  <text x="145" y="120" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">A</text>
  
  <!-- Block B (mB = 10 kg) -->
  <rect x="115" y="45" width="60" height="45" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <text x="145" y="73" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">B</text>
  
  <!-- Acceleration arrow a to the right -->
  <line x1="195" y1="105" x2="245" y2="105" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="245,105 235,100 235,110" fill="#ef4444"/>
  <text x="255" y="110" font-family="serif" font-size="16" font-style="italic" font-weight="bold" fill="#ef4444">a = 2 m/s²</text>
  
  <text x="170" y="175" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">m_A = 25 kg, m_B = 10 kg, μ_s = 0.8</text>
</svg>
