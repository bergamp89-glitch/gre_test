<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 250" width="100%" height="100%">
  <rect width="320" height="250" fill="#fcfcfd" rx="6"/>
  <!-- Closed cylindrical Gaussian surface -->
  <!-- Top cap ellipse -->
  <ellipse cx="160" cy="60" rx="55" ry="22" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Cylinder body -->
  <line x1="105" y1="60" x2="105" y2="180" stroke="#0f172a" stroke-width="2"/>
  <line x1="215" y1="60" x2="215" y2="180" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Bottom cap ellipse -->
  <path d="M 105 180 A 55 22 0 0 0 215 180" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  <path d="M 105 180 A 55 22 0 0 1 215 180" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- Surface patch marked A on the side -->
  <rect x="135" y="105" width="45" height="35" rx="3" fill="#e2e8f0" stroke="#2563eb" stroke-width="2"/>
  <text x="157" y="128" font-family="sans-serif" font-size="16" font-weight="bold" fill="#1e40af" text-anchor="middle">A</text>
  
  <text x="160" y="225" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">q_enc = +1 × 10⁻⁹ C,  Φ_A = -100 N·m²/C</text>
</svg>
