<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="100%">
  <rect width="340" height="260" fill="#fcfcfd" rx="6"/>
  <!-- Ceiling support plane -->
  <line x1="80" y1="40" x2="260" y2="40" stroke="#0f172a" stroke-width="2.5"/>
  <path d="M 90 40 L 80 30 M 110 40 L 100 30 M 130 40 L 120 30 M 150 40 L 140 30 M 170 40 L 160 30 M 190 40 L 180 30 M 210 40 L 200 30 M 230 40 L 220 30 M 250 40 L 240 30" stroke="#94a3b8" stroke-width="1.5"/>
  
  <!-- Pivot point at (170, 40) -->
  <circle cx="170" cy="40" r="3" fill="#0f172a"/>
  
  <!-- Vertical reference line -->
  <line x1="170" y1="40" x2="170" y2="210" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  
  <!-- Pendulum rod of length L at angle theta (to point 235, 180) -->
  <line x1="170" y1="40" x2="235" y2="180" stroke="#0f172a" stroke-width="2.5"/>
  <text x="215" y="105" font-family="serif" font-size="14" font-style="italic" font-weight="bold">L</text>
  
  <!-- Mass m bob -->
  <circle cx="235" cy="180" r="10" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="235" y="184" font-family="serif" font-size="12" font-style="italic" font-weight="bold" fill="#ffffff" text-anchor="middle">m</text>
  
  <!-- Angle theta arc -->
  <path d="M 170 90 A 50 50 0 0 1 188 83" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <text x="185" y="98" font-family="serif" font-size="14" font-style="italic" fill="#ef4444">θ</text>
  
  <!-- Azimuthal angle phi circular trajectory indication -->
  <ellipse cx="170" cy="180" rx="65" ry="20" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 215 198 A 50 16 0 0 1 232 188" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <text x="228" y="210" font-family="serif" font-size="14" font-style="italic" fill="#2563eb">ϕ</text>
</svg>
