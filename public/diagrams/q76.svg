<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 180" width="100%" height="100%">
  <rect width="380" height="180" fill="#fcfcfd" rx="6"/>
  <!-- Optical fiber cladding/core cylinder -->
  <rect x="130" y="30" width="220" height="100" fill="#e0f2fe" stroke="#0f172a" stroke-width="2"/>
  <text x="310" y="85" font-family="serif" font-size="16" font-style="italic" font-weight="bold" fill="#0284c7">n</text>
  
  <!-- Optical fiber normal axis -->
  <line x1="50" y1="80" x2="350" y2="80" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  
  <!-- Incident light ray entering from air at angle theta -->
  <line x1="60" y1="120" x2="130" y2="80" stroke="#ef4444" stroke-width="2"/>
  
  <!-- Angle theta arc -->
  <path d="M 85 80 A 45 45 0 0 1 95 100" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <text x="95" y="93" font-family="serif" font-size="14" font-style="italic" fill="#ef4444">θ</text>
  
  <!-- Refracted ray inside fiber traveling to top surface -->
  <line x1="130" y1="80" x2="210" y2="30" stroke="#ef4444" stroke-width="2"/>
  
  <!-- Reflected ray (Total Internal Reflection TIR) down into fiber -->
  <line x1="210" y1="30" x2="290" y2="80" stroke="#ef4444" stroke-width="2"/>
  
  <text x="190" y="155" font-family="sans-serif" font-size="11" fill="#475569" text-anchor="middle">Total Internal Reflection: θ &lt; sin⁻¹(√(n² - 1))</text>
</svg>
