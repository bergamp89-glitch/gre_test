<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <rect width="400" height="280" fill="#fcfcfd" rx="6"/>
  <!-- Focus S -->
  <circle cx="140" cy="140" r="7" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
  <text x="125" y="160" font-family="serif" font-size="16" font-style="italic" font-weight="bold" fill="#b45309">S</text>
  
  <!-- Elliptical orbit -->
  <ellipse cx="200" cy="140" rx="150" ry="105" fill="none" stroke="#334155" stroke-width="2"/>
  
  <!-- Shaded Sector A (near perihelion) -->
  <path d="M 140 140 L 75 80 A 150 105 0 0 1 150 37 Z" fill="#93c5fd" opacity="0.6" stroke="#2563eb" stroke-width="1.5"/>
  <text x="125" y="85" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">A</text>
  
  <!-- Shaded Sector B (near aphelion) -->
  <path d="M 140 140 L 350 140 A 150 105 0 0 1 335 185 Z" fill="#fde047" opacity="0.6" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="270" y="155" font-family="sans-serif" font-size="14" font-weight="bold" fill="#854d0e">B</text>
  
  <!-- 14 time interval ticks on orbit -->
  <circle cx="50" cy="140" r="2.5" fill="#334155"/>
  <circle cx="75" cy="80" r="2.5" fill="#334155"/>
  <circle cx="150" cy="37" r="2.5" fill="#334155"/>
  <circle cx="230" cy="38" r="2.5" fill="#334155"/>
  <circle cx="300" cy="70" r="2.5" fill="#334155"/>
  <circle cx="340" cy="105" r="2.5" fill="#334155"/>
  <circle cx="350" cy="140" r="2.5" fill="#334155"/>
  <circle cx="335" cy="185" r="2.5" fill="#334155"/>
  <circle cx="295" cy="215" r="2.5" fill="#334155"/>
  <circle cx="225" cy="242" r="2.5" fill="#334155"/>
  <circle cx="155" cy="243" r="2.5" fill="#334155"/>
  <circle cx="95" cy="220" r="2.5" fill="#334155"/>
  <circle cx="62" cy="180" r="2.5" fill="#334155"/>
  
  <text x="200" y="270" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Equal time intervals t = T/14 (Kepler's laws)</text>
</svg>
