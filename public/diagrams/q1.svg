<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 240" width="100%" height="100%">
  <rect width="500" height="240" fill="#fcfcfd" rx="6"/>
  <!-- Road markings -->
  <line x1="20" y1="90" x2="480" y2="90" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="12,8"/>
  <line x1="20" y1="170" x2="480" y2="170" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="20" y1="20" x2="480" y2="20" stroke="#cbd5e1" stroke-width="2"/>
  
  <!-- Car moving right -->
  <rect x="70" y="40" width="90" height="42" rx="8" fill="#3b82f6" stroke="#1e40af" stroke-width="2"/>
  <text x="115" y="65" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Car</text>
  <!-- Car velocity arrow -->
  <line x1="165" y1="61" x2="215" y2="61" stroke="#1e40af" stroke-width="2.5" marker-end="url(#arrow)"/>
  
  <!-- Ball thrown from passenger window -->
  <circle cx="130" cy="85" r="5" fill="#ef4444"/>
  <text x="130" y="105" font-family="sans-serif" font-size="11" font-weight="600" fill="#ef4444">Throw</text>
  
  <!-- Trajectories comparison -->
  <!-- A: Curved right -->
  <path d="M 130 85 Q 190 120 220 150" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="228" y="155" font-family="sans-serif" font-size="11" fill="#64748b">(A)</text>
  
  <!-- B: Straight diagonal (CORRECT) -->
  <line x1="130" y1="85" x2="195" y2="155" stroke="#10b981" stroke-width="3"/>
  <circle cx="195" cy="155" r="5" fill="#10b981"/>
  <text x="205" y="160" font-family="sans-serif" font-size="12" font-weight="bold" fill="#059669">(B) Ball path ✓</text>
  
  <!-- C: Curved forward -->
  <path d="M 130 85 Q 230 90 270 120" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="275" y="125" font-family="sans-serif" font-size="11" fill="#64748b">(C)</text>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e40af"/>
    </marker>
  </defs>
</svg>
