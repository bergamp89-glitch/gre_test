<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="100%">
  <rect width="340" height="260" fill="#fcfcfd" rx="6"/>
  <!-- Circular platform (turntable) -->
  <circle cx="170" cy="130" r="95" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Center axis -->
  <circle cx="170" cy="130" r="3" fill="#0f172a"/>
  
  <!-- Angular velocity / acceleration arrow -->
  <path d="M 265 105 A 105 105 0 0 0 240 60" fill="none" stroke="#2563eb" stroke-width="2"/>
  <polygon points="240,60 249,63 244,70" fill="#2563eb"/>
  <text x="255" y="60" font-family="serif" font-size="16" font-style="italic" font-weight="bold" fill="#2563eb">ω, α</text>
  
  <!-- Radius line from center to mass m -->
  <!-- Mass m at x = 240, y = 130 -->
  <line x1="170" y1="130" x2="240" y2="130" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="205" y="145" font-family="serif" font-size="14" font-style="italic" fill="#475569" text-anchor="middle">r</text>
  
  <!-- Mass m -->
  <circle cx="240" cy="130" r="6" fill="#0f172a"/>
  <text x="252" y="135" font-family="serif" font-size="15" font-style="italic" font-weight="bold">m</text>
  
  <!-- Inward radial line (to the left from mass m) -->
  <!-- Friction force fs at angle theta to inward radial -->
  <!-- Inward is (-1, 0), tangential is (0, -1) [upward, since ccw rotation] -->
  <!-- Vector fs points up and left: from (240, 130) to (195, 75) -->
  <line x1="240" y1="130" x2="195" y2="75" stroke="#ef4444" stroke-width="2.5"/>
  <polygon points="195,75 204,78 200,86" fill="#ef4444"/>
  <text x="180" y="65" font-family="serif" font-size="15" font-weight="bold" fill="#ef4444">fₛ</text>
  
  <!-- Angle theta between fs and inward radial direction -->
  <path d="M 210 130 A 30 30 0 0 1 218 103" fill="none" stroke="#ef4444" stroke-width="1.5"/>
  <text x="202" y="112" font-family="serif" font-size="14" font-style="italic" fill="#ef4444">θ</text>
  
  <text x="170" y="245" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">θ = tan⁻¹(α / ω²)</text>
</svg>
