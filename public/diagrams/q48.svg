<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <rect width="380" height="200" fill="#fcfcfd" rx="6"/>
  
  <!-- Inputs A, B -->
  <text x="35" y="48" font-family="serif" font-size="14" font-weight="bold">A</text>
  <line x1="50" y1="45" x2="90" y2="45" stroke="#0f172a" stroke-width="2"/>
  
  <text x="35" y="78" font-family="serif" font-size="14" font-weight="bold">B</text>
  <line x1="50" y1="75" x2="90" y2="75" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Top Gate: NOR gate -->
  <!-- Inputs at y=45, y=75, gate center at y=60 -->
  <path d="M 90 35 Q 105 60 90 85 Q 125 85 140 60 Q 125 35 90 35 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <!-- Inversion bubble -->
  <circle cx="145" cy="60" r="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <line x1="149" y1="60" x2="200" y2="60" stroke="#0f172a" stroke-width="2"/>
  <line x1="200" y1="60" x2="200" y2="90" stroke="#0f172a" stroke-width="2"/>
  <line x1="200" y1="90" x2="230" y2="90" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Inputs C, D -->
  <text x="35" y="133" font-family="serif" font-size="14" font-weight="bold">C</text>
  <line x1="50" y1="130" x2="90" y2="130" stroke="#0f172a" stroke-width="2"/>
  
  <text x="35" y="163" font-family="serif" font-size="14" font-weight="bold">D</text>
  <line x1="50" y1="160" x2="90" y2="160" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Bottom Gate: AND gate -->
  <path d="M 90 120 L 115 120 A 25 25 0 0 1 115 170 L 90 170 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <line x1="140" y1="145" x2="200" y2="145" stroke="#0f172a" stroke-width="2"/>
  <line x1="200" y1="145" x2="200" y2="115" stroke="#0f172a" stroke-width="2"/>
  <line x1="200" y1="115" x2="230" y2="115" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Final Gate: NOR gate -->
  <path d="M 230 80 Q 245 102 230 125 Q 265 125 280 102 Q 265 80 230 80 Z" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <circle cx="285" cy="102" r="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Output E -->
  <line x1="289" y1="102" x2="330" y2="102" stroke="#0f172a" stroke-width="2"/>
  <text x="338" y="107" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2563eb">Output E</text>
</svg>
