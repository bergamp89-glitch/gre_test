<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 200" width="100%" height="100%">
  <rect width="380" height="200" fill="#fcfcfd" rx="6"/>
  <!-- Energy level E dashed line -->
  <line x1="30" y1="45" x2="330" y2="45" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="340" y="48" font-family="serif" font-size="16" font-style="italic" fill="#2563eb">E</text>

  <!-- Step potential U(x) -->
  <!-- Region 1: x <= 0 has U = 0 -->
  <line x1="30" y1="95" x2="160" y2="95" stroke="#0f172a" stroke-width="3"/>
  <line x1="160" y1="95" x2="160" y2="140" stroke="#0f172a" stroke-width="3"/>
  <!-- Region 2: x > 0 has U = -U0 -->
  <line x1="160" y1="140" x2="330" y2="140" stroke="#0f172a" stroke-width="3"/>
  <text x="340" y="145" font-family="serif" font-size="15" font-style="italic">−U₀</text>

  <!-- Vertical dashed axis at x = 0 -->
  <line x1="160" y1="30" x2="160" y2="170" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.2"/>
  <text x="145" y="165" font-family="serif" font-size="14" font-style="italic">x = 0</text>

  <!-- Region Labels -->
  <text x="85" y="80" font-family="sans-serif" font-size="14" font-weight="600" fill="#475569">Region 1</text>
  <text x="235" y="125" font-family="sans-serif" font-size="14" font-weight="600" fill="#475569">Region 2</text>
</svg>
