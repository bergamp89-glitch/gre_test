<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 200" width="100%" height="100%">
  <rect width="460" height="200" fill="#fcfcfd" rx="6"/>
  
  <!-- Figure 1 -->
  <g transform="translate(30, 20)">
    <!-- Frictionless surface -->
    <line x1="0" y1="120" x2="190" y2="120" stroke="#0f172a" stroke-width="2"/>
    <!-- Hatching -->
    <path d="M 5 125 L 0 135 M 25 125 L 20 135 M 45 125 L 40 135 M 65 125 L 60 135 M 85 125 L 80 135 M 105 125 L 100 135 M 125 125 L 120 135 M 145 125 L 140 135 M 165 125 L 160 135 M 185 125 L 180 135" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Force F from left -->
    <line x1="10" y1="85" x2="55" y2="85" stroke="#2563eb" stroke-width="2.5"/>
    <polygon points="55,85 45,80 45,90" fill="#2563eb"/>
    <text x="10" y="75" font-family="serif" font-size="16" font-weight="bold" fill="#2563eb">F</text>
    
    <!-- Block 2m -->
    <rect x="60" y="50" width="60" height="70" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <text x="90" y="90" font-family="serif" font-size="16" font-style="italic" font-weight="bold" text-anchor="middle">2m</text>
    
    <!-- Block m -->
    <rect x="120" y="70" width="45" height="50" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
    <text x="142" y="100" font-family="serif" font-size="16" font-style="italic" font-weight="bold" text-anchor="middle">m</text>
    
    <text x="95" y="155" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Figure 1</text>
  </g>
  
  <!-- Figure 2 -->
  <g transform="translate(240, 20)">
    <!-- Frictionless surface -->
    <line x1="0" y1="120" x2="190" y2="120" stroke="#0f172a" stroke-width="2"/>
    <!-- Hatching -->
    <path d="M 5 125 L 0 135 M 25 125 L 20 135 M 45 125 L 40 135 M 65 125 L 60 135 M 85 125 L 80 135 M 105 125 L 100 135 M 125 125 L 120 135 M 145 125 L 140 135 M 165 125 L 160 135 M 185 125 L 180 135" stroke="#94a3b8" stroke-width="1.5"/>
    
    <!-- Block 2m -->
    <rect x="30" y="50" width="60" height="70" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
    <text x="60" y="90" font-family="serif" font-size="16" font-style="italic" font-weight="bold" text-anchor="middle">2m</text>
    
    <!-- Block m -->
    <rect x="90" y="70" width="45" height="50" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>
    <text x="112" y="100" font-family="serif" font-size="16" font-style="italic" font-weight="bold" text-anchor="middle">m</text>
    
    <!-- Force F from right -->
    <line x1="180" y1="85" x2="140" y2="85" stroke="#2563eb" stroke-width="2.5"/>
    <polygon points="140,85 150,80 150,90" fill="#2563eb"/>
    <text x="175" y="75" font-family="serif" font-size="16" font-weight="bold" fill="#2563eb">F</text>
    
    <text x="95" y="155" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Figure 2</text>
  </g>
</svg>
