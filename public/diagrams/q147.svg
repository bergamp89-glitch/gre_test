<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 220" width="100%" height="100%">
  <rect width="420" height="220" fill="#fcfcfd" rx="6"/>

  <!-- Figure 1 -->
  <g transform="translate(30, 20)">
    <!-- Water surface -->
    <path d="M 10 90 Q 25 86 40 90 T 70 90 T 100 90 T 130 90 T 160 90" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 10 90 L 10 160 L 160 160 L 160 90 Z" fill="#f0f9ff" opacity="0.6"/>

    <!-- Wooden Block -->
    <rect x="35" y="60" width="100" height="60" fill="#fed7aa" stroke="#0f172a" stroke-width="2"/>
    <text x="85" y="115" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Block</text>

    <!-- Stone on top -->
    <rect x="65" y="45" width="40" height="15" fill="#94a3b8" stroke="#0f172a" stroke-width="1.8"/>
    <text x="85" y="57" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Stone</text>

    <text x="85" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 1</text>
  </g>

  <!-- Figure 2 (Flipped) -->
  <g transform="translate(230, 20)">
    <!-- Water surface -->
    <path d="M 10 90 Q 25 86 40 90 T 70 90 T 100 90 T 130 90 T 160 90" fill="none" stroke="#38bdf8" stroke-width="2"/>
    <path d="M 10 90 L 10 160 L 160 160 L 160 90 Z" fill="#f0f9ff" opacity="0.6"/>

    <!-- Wooden Block flipped -->
    <rect x="35" y="65" width="100" height="60" fill="#fed7aa" stroke="#0f172a" stroke-width="2"/>
    <text x="85" y="95" font-family="sans-serif" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">Block</text>

    <!-- Stone glued to bottom -->
    <rect x="65" y="125" width="40" height="15" fill="#94a3b8" stroke="#0f172a" stroke-width="1.8"/>
    <text x="85" y="137" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a" text-anchor="middle">Stone</text>

    <text x="85" y="180" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">Figure 2</text>
  </g>
</svg>
