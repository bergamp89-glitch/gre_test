<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 220" width="100%" height="100%">
  <rect width="340" height="220" fill="#fcfcfd" rx="6"/>
  <!-- Switch S -->
  <line x1="80" y1="50" x2="130" y2="50" stroke="#0f172a" stroke-width="2"/>
  <circle cx="130" cy="50" r="3" fill="#0f172a"/>
  <!-- Open lever -->
  <line x1="130" y1="50" x2="165" y2="35" stroke="#0f172a" stroke-width="2.5"/>
  <circle cx="170" cy="50" r="3" fill="#0f172a"/>
  <line x1="170" y1="50" x2="240" y2="50" stroke="#0f172a" stroke-width="2"/>
  <text x="145" y="30" font-family="serif" font-size="14" font-style="italic" font-weight="bold">S</text>
  
  <!-- Right wire down to Inductor L -->
  <line x1="240" y1="50" x2="240" y2="85" stroke="#0f172a" stroke-width="2"/>
  <!-- Inductor coils -->
  <path d="M 240 85 C 255 85, 255 95, 240 95 C 255 95, 255 105, 240 105 C 255 105, 255 115, 240 115 C 255 115, 255 125, 240 125" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <line x1="240" y1="125" x2="240" y2="160" stroke="#0f172a" stroke-width="2"/>
  <text x="260" y="110" font-family="serif" font-size="15" font-style="italic" font-weight="bold">L</text>
  
  <!-- Left wire down to Capacitor C -->
  <line x1="80" y1="50" x2="80" y2="98" stroke="#0f172a" stroke-width="2"/>
  <!-- Capacitor plates -->
  <line x1="65" y1="98" x2="95" y2="98" stroke="#0f172a" stroke-width="3"/>
  <line x1="65" y1="108" x2="95" y2="108" stroke="#0f172a" stroke-width="3"/>
  <text x="50" y="106" font-family="serif" font-size="15" font-style="italic" font-weight="bold">C</text>
  <line x1="80" y1="108" x2="80" y2="160" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Bottom wire -->
  <line x1="80" y1="160" x2="240" y2="160" stroke="#0f172a" stroke-width="2"/>
  
  <text x="160" y="200" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Ideal LC circuit (Switch S closed at t = 0)</text>
</svg>
