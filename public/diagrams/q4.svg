<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" width="100%" height="100%">
  <rect width="360" height="260" fill="#fcfcfd" rx="6"/>
  <!-- Circular loop in xy-plane -->
  <ellipse cx="180" cy="140" rx="100" ry="42" fill="none" stroke="#2563eb" stroke-width="3"/>
  
  <!-- Loop current direction I2 -->
  <path d="M 230 178 L 245 174 L 235 166" fill="#2563eb"/>
  <text x="250" y="185" font-family="serif" font-size="16" font-style="italic" font-weight="bold" fill="#2563eb">I₂</text>
  
  <!-- Vertical wire through center -->
  <line x1="180" y1="20" x2="180" y2="240" stroke="#0f172a" stroke-width="3.5"/>
  <!-- Arrow for I1 -->
  <polygon points="180,25 174,40 186,40" fill="#0f172a"/>
  <text x="195" y="42" font-family="serif" font-size="16" font-style="italic" font-weight="bold" fill="#0f172a">I₁</text>
  
  <!-- Magnetic field circles indication -->
  <ellipse cx="180" cy="140" rx="60" ry="25" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="180" y="245" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Long wire perpendicular to circular loop plane</text>
</svg>
