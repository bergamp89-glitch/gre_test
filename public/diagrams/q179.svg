<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="100%" height="100%">
  <rect width="380" height="240" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Table -->
  <line x1="40" y1="90" x2="260" y2="90" stroke="#0f172a" stroke-width="3"/>
  <line x1="260" y1="90" x2="260" y2="200" stroke="#0f172a" stroke-width="2"/>

  <!-- Block m1 on table -->
  <rect x="100" y="55" width="60" height="35" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="130" y="78" font-family="serif" font-size="15" font-style="italic" text-anchor="middle">m₁</text>
  <!-- Motion arrow on m1 -->
  <line x1="175" y1="65" x2="215" y2="65" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr)"/>

  <!-- Pulley at table edge -->
  <circle cx="260" cy="90" r="12" fill="#cbd5e1" stroke="#0f172a" stroke-width="2"/>

  <!-- String connecting m1 to pulley and hanging m2 -->
  <line x1="160" y1="72" x2="260" y2="78" stroke="#0f172a" stroke-width="1.8"/>
  <line x1="272" y1="90" x2="272" y2="150" stroke="#0f172a" stroke-width="1.8"/>

  <!-- Hanging mass m2 -->
  <circle cx="272" cy="165" r="15" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="298" y="170" font-family="serif" font-size="15" font-style="italic">m₂</text>
  <!-- Downward arrow on m2 -->
  <line x1="290" y1="115" x2="290" y2="145" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr)"/>
</svg>
