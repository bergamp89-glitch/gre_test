<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <rect width="320" height="280" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Rectangular block of plastic -->
  <rect x="140" y="80" width="140" height="180" fill="#f1f5f9" stroke="#0f172a" stroke-width="2"/>

  <!-- Top surface normal at entry point (180, 80) -->
  <line x1="180" y1="40" x2="180" y2="120" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.2"/>

  <!-- Incident ray from air -->
  <line x1="110" y1="40" x2="180" y2="80" stroke="#0f172a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 155 65 A 30 30 0 0 1 180 50" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <text x="160" y="55" font-family="serif" font-size="14" font-style="italic">α</text>

  <!-- Refracted ray inside block going toward side (210, 150) -->
  <line x1="180" y1="80" x2="210" y2="150" stroke="#0f172a" stroke-width="2"/>
  <text x="185" y="105" font-family="serif" font-size="14" font-style="italic">θ</text>

  <!-- Side reflection and refraction at (210, 150) or right face? In ETS figure, ray hits right side face or an internal boundary? -->
  <!-- In the figure: ray hits the RIGHT face at an angle of 60°: partially reflects downward and partly refracts outward into air -->
  <!-- Let right face be x = 200, so ray hits at (200, 150). Reflected ray goes down-left at 60°. Refracted ray goes into air. -->
  <line x1="210" y1="150" x2="170" y2="210" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="210" y1="150" x2="260" y2="180" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="185" y="175" font-family="sans-serif" font-size="13">60°</text>
</svg>
