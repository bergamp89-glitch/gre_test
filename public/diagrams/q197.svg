<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 240" width="100%" height="100%">
  <rect width="380" height="240" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Ceiling -->
  <line x1="80" y1="30" x2="300" y2="30" stroke="#0f172a" stroke-width="3"/>

  <!-- Gravity vector -->
  <line x1="120" y1="50" x2="120" y2="85" stroke="#0f172a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="105" y="70" font-family="serif" font-size="14" font-style="italic">g</text>

  <!-- Pendulum 1 vertical dashed line -->
  <line x1="140" y1="30" x2="140" y2="170" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.2"/>
  <!-- Pendulum 1 rod -->
  <line x1="140" y1="30" x2="165" y2="165" stroke="#0f172a" stroke-width="2"/>
  <!-- Angle theta 1 arc -->
  <path d="M 140 70 A 40 40 0 0 1 148 68" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <text x="144" y="85" font-family="serif" font-size="12" font-style="italic">θ₁</text>
  <text x="165" y="100" font-family="serif" font-size="13" font-style="italic">a</text>
  <!-- Bob 1 -->
  <circle cx="165" cy="165" r="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="165" y="170" font-family="serif" font-size="13" font-style="italic" text-anchor="middle">m</text>

  <!-- Pendulum 2 vertical dashed line -->
  <line x1="260" y1="30" x2="260" y2="170" stroke="#94a3b8" stroke-dasharray="3,3" stroke-width="1.2"/>
  <!-- Pendulum 2 rod -->
  <line x1="260" y1="30" x2="295" y2="165" stroke="#0f172a" stroke-width="2"/>
  <!-- Angle theta 2 arc -->
  <path d="M 260 70 A 40 40 0 0 1 272 67" fill="none" stroke="#0f172a" stroke-width="1.2"/>
  <text x="268" y="85" font-family="serif" font-size="12" font-style="italic">θ₂</text>
  <text x="290" y="100" font-family="serif" font-size="13" font-style="italic">a</text>
  <!-- Bob 2 -->
  <circle cx="295" cy="165" r="14" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="295" y="170" font-family="serif" font-size="13" font-style="italic" text-anchor="middle">m</text>

  <!-- Coupling spring k between bobs -->
  <path d="M 179 165 C 190 155, 195 175, 205 165 C 215 155, 220 175, 230 165 C 240 155, 245 175, 255 165 C 265 155, 270 175, 281 165" fill="none" stroke="#0f172a" stroke-width="1.8"/>
  <text x="230" y="195" font-family="serif" font-size="15" font-style="italic" text-anchor="middle">k</text>
</svg>
