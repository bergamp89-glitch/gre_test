<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%">
  <rect width="360" height="220" fill="#fcfcfd" rx="6"/>
  <!-- Tank container -->
  <rect x="70" y="30" width="220" height="150" fill="none" stroke="#334155" stroke-width="2.5"/>
  
  <!-- Oil layer -->
  <rect x="71" y="55" width="218" height="40" fill="#fef3c7" opacity="0.8"/>
  <text x="110" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#b45309">Oil (800 kg/m³)</text>
  
  <!-- Water layer -->
  <rect x="71" y="95" width="218" height="84" fill="#bae6fd" opacity="0.8"/>
  <line x1="71" y1="95" x2="289" y2="95" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="110" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0369a1">Water (1,000 kg/m³)</text>
  
  <!-- Floating block -->
  <!-- 1/4 in oil (15px), 3/4 in water (45px) -> total height 60px -->
  <rect x="200" y="80" width="65" height="60" fill="#94a3b8" stroke="#0f172a" stroke-width="2"/>
  <!-- Markers for 1/4 and 3/4 -->
  <text x="232" y="92" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">1/4</text>
  <text x="232" y="125" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3/4</text>
</svg>
