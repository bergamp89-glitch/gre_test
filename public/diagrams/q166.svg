<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="100%" height="100%">
  <rect width="240" height="280" fill="#fcfcfd" rx="6"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Ceiling -->
  <line x1="60" y1="20" x2="160" y2="20" stroke="#0f172a" stroke-width="3"/>
  <line x1="65" y1="20" x2="75" y2="12" stroke="#64748b" stroke-width="1.5"/>
  <line x1="85" y1="20" x2="95" y2="12" stroke="#64748b" stroke-width="1.5"/>
  <line x1="105" y1="20" x2="115" y2="12" stroke="#64748b" stroke-width="1.5"/>
  <line x1="125" y1="20" x2="135" y2="12" stroke="#64748b" stroke-width="1.5"/>
  <line x1="145" y1="20" x2="155" y2="12" stroke="#64748b" stroke-width="1.5"/>

  <!-- Top spring k -->
  <path d="M 110 20 L 110 35 C 125 38, 125 48, 110 48 C 95 48, 95 58, 110 58 C 125 58, 125 68, 110 68 C 95 68, 95 78, 110 78 C 125 78, 125 88, 110 88 L 110 98" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="80" y="65" font-family="serif" font-size="16" font-style="italic">k</text>

  <!-- Connection point -->
  <circle cx="110" cy="98" r="3" fill="#0f172a"/>

  <!-- Bottom spring k -->
  <path d="M 110 98 L 110 110 C 125 113, 125 123, 110 123 C 95 123, 95 133, 110 133 C 125 133, 125 143, 110 143 C 95 143, 95 153, 110 153 C 125 153, 125 163, 110 163 L 110 175" fill="none" stroke="#0f172a" stroke-width="2"/>
  <text x="80" y="140" font-family="serif" font-size="16" font-style="italic">k</text>

  <!-- Block of mass m -->
  <rect x="85" y="175" width="50" height="35" fill="#e2e8f0" stroke="#0f172a" stroke-width="2"/>
  <text x="110" y="198" font-family="serif" font-size="16" font-style="italic" text-anchor="middle">m</text>

  <!-- Displacement arrow x -->
  <line x1="160" y1="175" x2="160" y2="210" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="175" y="198" font-family="serif" font-size="15" font-style="italic" fill="#2563eb">x</text>
  <line x1="150" y1="175" x2="170" y2="175" stroke="#94a3b8" stroke-dasharray="2,2"/>
</svg>
