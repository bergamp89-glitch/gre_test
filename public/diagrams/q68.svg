<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" width="100%" height="100%">
  <rect width="360" height="280" fill="#fcfcfd" rx="6"/>
  <!-- Top rail -->
  <line x1="70" y1="40" x2="230" y2="40" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Bottom rail -->
  <line x1="70" y1="220" x2="230" y2="220" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Helper macro: vertical resistor of length 40px -->
  <!-- Left branch (x=70): top resistor (40 to 120), bottom resistor (140 to 220) -->
  <line x1="70" y1="40" x2="70" y2="60" stroke="#0f172a" stroke-width="2"/>
  <rect x="62" y="60" width="16" height="30" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="50" y="79" font-family="serif" font-size="13" font-style="italic">R</text>
  <line x1="70" y1="90" x2="70" y2="140" stroke="#0f172a" stroke-width="2"/>
  <rect x="62" y="140" width="16" height="30" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="50" y="160" font-family="serif" font-size="13" font-style="italic">R</text>
  <line x1="70" y1="170" x2="70" y2="220" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Middle branch (x=150): top resistor, bottom resistor -->
  <line x1="150" y1="40" x2="150" y2="60" stroke="#0f172a" stroke-width="2"/>
  <rect x="142" y="60" width="16" height="30" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="165" y="79" font-family="serif" font-size="13" font-style="italic">R</text>
  <line x1="150" y1="90" x2="150" y2="140" stroke="#0f172a" stroke-width="2"/>
  <rect x="142" y="140" width="16" height="30" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="165" y="160" font-family="serif" font-size="13" font-style="italic">R</text>
  <line x1="150" y1="170" x2="150" y2="220" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Right branch (x=230): top resistor, bottom resistor -->
  <line x1="230" y1="40" x2="230" y2="60" stroke="#0f172a" stroke-width="2"/>
  <rect x="222" y="60" width="16" height="30" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="245" y="79" font-family="serif" font-size="13" font-style="italic">R</text>
  <line x1="230" y1="90" x2="230" y2="140" stroke="#0f172a" stroke-width="2"/>
  <rect x="222" y="140" width="16" height="30" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="245" y="160" font-family="serif" font-size="13" font-style="italic">R</text>
  <line x1="230" y1="170" x2="230" y2="220" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Horizontal bridge resistors at y=115 -->
  <!-- Left to middle: from x=70 to x=150 -->
  <line x1="70" y1="115" x2="95" y2="115" stroke="#0f172a" stroke-width="2"/>
  <rect x="95" y="107" width="30" height="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="110" y="100" font-family="serif" font-size="13" font-style="italic" text-anchor="middle">R</text>
  <line x1="125" y1="115" x2="150" y2="115" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Middle to right: from x=150 to x=230 -->
  <line x1="150" y1="115" x2="175" y2="115" stroke="#0f172a" stroke-width="2"/>
  <rect x="175" y="107" width="30" height="16" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
  <text x="190" y="100" font-family="serif" font-size="13" font-style="italic" text-anchor="middle">R</text>
  <line x1="205" y1="115" x2="230" y2="115" stroke="#0f172a" stroke-width="2"/>
  
  <!-- Battery V on the right -->
  <line x1="230" y1="40" x2="290" y2="40" stroke="#0f172a" stroke-width="2"/>
  <line x1="290" y1="40" x2="290" y2="120" stroke="#0f172a" stroke-width="2"/>
  <!-- Long plate -->
  <line x1="275" y1="120" x2="305" y2="120" stroke="#0f172a" stroke-width="3"/>
  <!-- Short plate -->
  <line x1="280" y1="130" x2="300" y2="130" stroke="#0f172a" stroke-width="3"/>
  <text x="315" y="130" font-family="serif" font-size="16" font-style="italic" font-weight="bold">V</text>
  <line x1="290" y1="130" x2="290" y2="220" stroke="#0f172a" stroke-width="2"/>
  <line x1="290" y1="220" x2="230" y2="220" stroke="#0f172a" stroke-width="2"/>
</svg>
