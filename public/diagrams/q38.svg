<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 260" width="100%" height="100%">
  <rect width="340" height="260" fill="#fcfcfd" rx="6"/>
  <!-- Axes coordinate frame indicator (top right) -->
  <g transform="translate(260, 45)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="25,0 20,-3 20,3" fill="#0f172a"/>
    <text x="30" y="4" font-family="serif" font-size="12">x̂</text>
    
    <line x1="0" y1="0" x2="0" y2="-25" stroke="#0f172a" stroke-width="1.5"/>
    <polygon points="0,-25 -3,-20 3,-20" fill="#0f172a"/>
    <text x="4" y="-28" font-family="serif" font-size="12">ŷ</text>
    
    <circle cx="0" cy="0" r="3" fill="#0f172a"/>
    <text x="-12" y="-5" font-family="serif" font-size="12">ẑ ⊙</text>
  </g>
  
  <!-- Wire 1 along x-axis -->
  <line x1="40" y1="170" x2="280" y2="170" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="240,170 230,165 230,175" fill="#0f172a"/>
  <text x="245" y="185" font-family="serif" font-size="15" font-style="italic" font-weight="bold">I</text>
  
  <!-- Wire 2 along y-axis -->
  <line x1="130" y1="40" x2="130" y2="230" stroke="#0f172a" stroke-width="2.5"/>
  <polygon points="130,80 125,90 135,90" fill="#0f172a"/>
  <text x="110" y="85" font-family="serif" font-size="15" font-style="italic" font-weight="bold">I</text>
  
  <!-- Point P at (a, a) -->
  <circle cx="210" cy="90" r="4" fill="#ef4444"/>
  <text x="220" y="95" font-family="serif" font-size="15" font-weight="bold" fill="#ef4444">P (a, a)</text>
  
  <!-- Distances a and a -->
  <line x1="130" y1="90" x2="210" y2="90" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="170" y="84" font-family="serif" font-size="13" font-style="italic" fill="#475569" text-anchor="middle">a</text>
  
  <line x1="210" y1="170" x2="210" y2="90" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="218" y="135" font-family="serif" font-size="13" font-style="italic" fill="#475569">a</text>
</svg>
